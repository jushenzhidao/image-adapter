version: "3.8"

networks:
  adapter-net:
    driver: bridge

services:
  adapter:
    build:
      context: .
      dockerfile: Dockerfile
    image: openai-adapter:latest
    container_name: adapter
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./script_store:/app/script_store:ro
    environment:
      - LOGFIRE_TOKEN=${LOGFIRE_TOKEN:-}
      - REDIS_URL=redis://redis:6379/0
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET=adapter-temp
      - MINIO_SECURE=false
      - SCRIPT_REF_DIR=/app/script_store
      - SCRIPT_TIMEOUT=30.0
      # 2K 同步生成实测 27~82s，60s 会截断慢请求
      - UPSTREAM_TIMEOUT=180.0
      - ENVIRONMENT=production
      # 数据面门禁。内联脚本即远程代码执行，缺这一项时适配器会拒绝所有请求。
      - ADAPTER_KEY=${ADAPTER_KEY:?ADAPTER_KEY must be set}
    depends_on:
      - redis
      - minio
      - mock-upstream
    networks:
      - adapter-net
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=100m

  mock-upstream:
    build:
      context: .
      dockerfile: Dockerfile
    image: openai-adapter:latest
    container_name: mock-upstream
    restart: unless-stopped
    ports:
      - "9100:9100"
    command: ["python", "-m", "uvicorn", "mock_upstream.main:app", "--host", "0.0.0.0", "--port", "9100"]
    networks:
      - adapter-net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  redis:
    image: redis:7-alpine
    container_name: adapter-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - adapter-net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  minio:
    image: minio/minio:latest
    container_name: adapter-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - minio_data:/data
    networks:
      - adapter-net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

volumes:
  redis_data:
  minio_data:
