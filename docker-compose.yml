# The adapter is a stateless transparent proxy: the upstream URL, credentials,
# timeout and script all arrive per-request from the control plane (New API) as
# headers. Nothing here needs a database, a cache or an object store to boot.
#
# Redis and MinIO are therefore optional accelerators, not dependencies, and
# they are configured in .env rather than declared here:
#   REDIS_URL empty  -> state/cache fall back to in-process stores
#   MINIO_ENDPOINT empty -> ctx.image_url() falls back to a data URI
# Point those at managed services when you want cross-worker state and real
# public URLs; leave them empty for a single-node deployment.

services:
  adapter:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/jushenzhidao/image-adapter:latest
    container_name: adapter
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"

    # Single source of truth for configuration. Every Settings field is read
    # from here by name (see adapter/settings.py), so adding a knob needs no
    # compose change. ADAPTER_KEY gates the data plane and must be set: inline
    # scripts are remote code execution by design.
    env_file:
      - .env

    environment:
      # Overrides .env: named refs resolve inside the image, not on the host.
      SCRIPT_REF_DIR: /app/script_store
      # gunicorn binds this port inside the container; the host mapping above
      # is what varies between deployments.
      PORT: 8080

    # Default: no volumes. script_store is baked into the image, so the
    # container has no host-path dependency and can be scheduled anywhere.
    #
    # To hot-patch a script without rebuilding, mount one or more read-only
    # roots and list them in SCRIPT_OVERLAY_DIRS. Overlays are searched before
    # the baked store, so a ref present in both resolves to the overlay, and
    # anything absent still falls through to the image. Script compilation is
    # keyed on source sha256, so an edited file takes effect with no restart:
    #
    #   volumes:
    #     - ./script_overlay:/mnt/script_overlay:ro
    #   environment:
    #     SCRIPT_OVERLAY_DIRS: /mnt/script_overlay

    # Hardening. The process only ever writes to /tmp (gunicorn worker
    # heartbeats), so the root filesystem stays read-only.
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=256m
    security_opt:
      - no-new-privileges:true

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=5).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3

    # File descriptors, not CPU or memory, are the binding constraint: each
    # in-flight generation holds an inbound and an outbound socket for up to
    # 80s. CPU/memory limits are deliberately absent so the container can use
    # whatever the host has; set them per environment if you need isolation.
    ulimits:
      nofile:
        soft: 65535
        hard: 65535

    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
