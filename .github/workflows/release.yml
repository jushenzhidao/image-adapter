name: Release

# Tag 触发，而非 push main 自动 bump：版本号由人决定，
# 每次 push 就发一个公开 Release 太激进。打 tag 即发版。
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.0.0); the tag must already exist'
        required: true

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gh release create --generate-notes 需要完整历史，浅克隆会生成空 notes
          fetch-depth: 0

      - name: Resolve version
        id: ver
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG='${{ github.event.inputs.tag }}'
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          case "$TAG" in
            v*) ;;
            *) echo "::error::tag must start with v: $TAG"; exit 1 ;;
          esac
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        run: |
          set -euo pipefail
          echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin

      - name: Build and push image
        run: |
          set -euo pipefail
          IMAGE='${{ steps.ver.outputs.image }}'
          docker build \
            -t "$IMAGE:${{ steps.ver.outputs.version }}" \
            -t "$IMAGE:latest" \
            .
          docker push "$IMAGE:${{ steps.ver.outputs.version }}"
          docker push "$IMAGE:latest"

      - name: Build changelog
        run: |
          set -euo pipefail
          TAG='${{ steps.ver.outputs.tag }}'
          REPO_URL='https://github.com/${{ github.repository }}'
          # --generate-notes relies on merged pull requests, and this repo pushes
          # straight to main, so it emitted nothing but a compare link. Build the
          # list from commits instead, which works with or without PRs.
          #
          # TAG^ peels the annotated tag to its commit and takes the first
          # parent, so describe returns the PREVIOUS version tag, not this one.
          PREV=''
          if PREV="$(git describe --tags --abbrev=0 --match 'v*.*.*' "${TAG}^" 2>/dev/null)"; then
            RANGE="${PREV}..${TAG}"
          else
            RANGE="${TAG}"   # first tagged release: list everything reachable
          fi
          {
            if [ -n "$PREV" ]; then
              printf '**Full changelog**: %s/compare/%s...%s\n\n' "$REPO_URL" "$PREV" "$TAG"
              printf '## Changes since %s\n\n' "$PREV"
            else
              printf '## Initial release\n\n'
            fi
            git log --no-merges --pretty='- %s (%h)' "$RANGE"
          } > CHANGELOG.md
          cat CHANGELOG.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create '${{ steps.ver.outputs.tag }}' \
            --title '${{ steps.ver.outputs.tag }}' \
            --notes-file CHANGELOG.md

      # Package visibility is deliberately NOT automated here. The documented
      # routes (PATCH /user/packages/{type}/{name} and the org equivalent) need a
      # classic PAT with write:packages, because GITHUB_TOKEN cannot administer
      # user-scoped packages -- the previous attempt at this called an
      # undocumented path, returned 404 on every run, and hid it behind
      # continue-on-error. Visibility is a one-time manual setting that persists
      # across pushes, so verify it by hand after the first release:
      #
      #   anonymous pull proves it, no credentials needed:
      #     TOKEN=$(curl -s "https://ghcr.io/token?scope=repository:OWNER/NAME:pull&service=ghcr.io" \
      #       | python3 -c 'import sys,json;print(json.load(sys.stdin)["token"])')
      #     curl -o /dev/null -w '%{http_code}\n' -H "Authorization: Bearer $TOKEN" \
      #       https://ghcr.io/v2/OWNER/NAME/manifests/latest   # 200 = public
