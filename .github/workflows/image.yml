name: Image

# push main 即构建镜像并推送到 GHCR，tag 为 main 与 sha-<short>。
#
# 与 release.yml 的分工：那个由 tag 触发，推「版本号 + latest」并创建 Release；
# 这个只出「开发镜像」，**不碰 latest、不发 Release**。latest 的语义保持为
# 「最新正式版」，否则一次未发版的 push 会把 latest 悄悄改掉。
#
# 之所以把构建放在 CI：本地 docker build 不通（Docker Hub 出口不稳定），
# 镜像的实际产地就是这里。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  # main 的构建可被新 push 取消：只保留最新一次的结果。
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # 先跑测试再构建：镜像一旦推到 GHCR 就可能被部署，不值得为没跑过测试的
      # 代码出镜像。测试全走降级的本地路径（REDIS_URL/MINIO 为空），不需要外部服务。
      - name: Run tests
        env:
          # 未设置 token 时 logfire 只在本进程内运行，不会向云端发 trace。
          LOGFIRE_TOKEN: ''
        run: python -m pytest tests/ -q

      - name: Log in to GitHub Container Registry
        run: |
          set -euo pipefail
          echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin

      - name: Build and push image
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          SHA="$(git rev-parse --short=7 HEAD)"
          echo "building $IMAGE:main and $IMAGE:sha-$SHA"
          docker build -t "$IMAGE:main" -t "$IMAGE:sha-$SHA" .
          docker push "$IMAGE:main"
          docker push "$IMAGE:sha-$SHA"
          echo "### 镜像已推送" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`$IMAGE:main\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`$IMAGE:sha-$SHA\`" >> "$GITHUB_STEP_SUMMARY"
